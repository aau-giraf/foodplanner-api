# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run backend in background
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        WORKSPACE: ${{ secrets.WORKSPACE }}
      run: |
        dotnet run --no-build --urls http://localhost:8080 --project FoodplannerApi/FoodplannerApi.csproj &
        echo $! > backend.pid

    - name: Wait for backend to be ready
      run: |
          for i in {1..15}; do
            if curl -sf http://localhost:8080/swagger/index.json; then
              echo "Backend is up!";
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did not start in time" >&2
          exit 1

    - name: Generate OpenAPI JSON
      run: curl http://localhost:8080/swagger/index.json -o openapi.json

    - name: Push openapi.json to openapi-staging branch
      run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Tjek om openapi-staging eksisterer, ellers opret
          git fetch origin openapi-staging || true
          git checkout -B openapi-staging origin/openapi-staging || git checkout -b openapi-staging

          cp openapi.json ./openapi.json

          git add openapi.json
          git commit -m "chore: update openapi.json [skip ci]" || echo "No changes to commit"

          git push origin openapi-staging
