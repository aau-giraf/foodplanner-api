# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giraf
        ports:
          - 7654:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

      
    - name: Run backend in background
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        WORKSPACE: ${{ secrets.WORKSPACE }}
        DB_HOST: 127.0.0.1
        DB_PORT: 7654
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: giraf
      run: |
        dotnet run --no-build --urls http://localhost:8080 --project FoodplannerApi/FoodplannerApi.csproj &
        echo $! > backend.pid &
        sleep 5

    - name: Generate OpenAPI JSON
      run: curl http://localhost:8080/swagger/index.json -o openapi.json

    - name: Push openapi.json to openapi-staging branch
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout -B openapi-staging
        git add openapi.json
        git commit -m "chore: update openapi.json [skip ci]" || echo "No changes to commit"
        git push origin openapi-staging
